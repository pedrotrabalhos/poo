spring.application.name=vehicle-inventory
spring.config.import=optional:file:.env.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vehicle_inventory}
spring.datasource.username=${DB_USERNAME:vehicle_inventory}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
spring.jackson.deserialization.fail-on-unknown-properties=true
